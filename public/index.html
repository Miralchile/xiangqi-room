<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>中国象棋</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="lobbyApp" class="lobbyApp">
      <header class="lobbyHeader">
        <div>
          <h1>棋局大厅</h1>
          <p>加入公开房间，或创建一场新的对局</p>
        </div>
        <div class="lobbyHeaderActions">
          <div class="lobbyOnline"><span id="publicRoomCount">0</span> 个公开房间</div>
          <label class="themeToggle">
            <input class="themeInput" type="checkbox" />
            <span>夜间模式</span>
          </label>
        </div>
      </header>

      <section class="lobbySurface">
        <div class="lobbyTabs" role="tablist" aria-label="大厅功能">
          <button id="publicRoomsTab" type="button" role="tab" aria-selected="true" aria-controls="publicRoomsView">公开房间</button>
          <button id="createJoinTab" type="button" role="tab" aria-selected="false" aria-controls="createJoinView">创建或加入</button>
        </div>

        <section id="publicRoomsView" role="tabpanel" aria-labelledby="publicRoomsTab">
          <div id="publicRoomsList" class="publicRoomsList"></div>
        </section>

        <section id="createJoinView" class="createJoinView hidden" role="tabpanel" aria-labelledby="createJoinTab">
          <section class="lobbySection">
            <div class="sectionHeading">
              <h2>创建房间</h2>
              <span>创建后自动进入房间</span>
            </div>
            <form id="createRoomForm">
              <fieldset class="gameChoices">
                <legend>选择游戏</legend>
                <label><input type="radio" name="gameType" value="xiangqi" checked /><span>象棋</span></label>
                <label class="comingSoon"><input type="radio" name="gameType" value="gomoku" disabled /><span>五子棋<small>即将开放</small></span></label>
                <label class="comingSoon"><input type="radio" name="gameType" value="chess" disabled /><span>国际象棋<small>即将开放</small></span></label>
                <label class="comingSoon"><input type="radio" name="gameType" value="go" disabled /><span>围棋<small>即将开放</small></span></label>
              </fieldset>
              <label class="visibilityOption">
                <input id="publicRoomInput" type="checkbox" checked />
                <span><strong>公开房间</strong><small>显示在大厅列表中，任何人都可加入</small></span>
              </label>
              <button id="createRoomBtn" type="submit">创建并进入</button>
            </form>
          </section>

          <section class="lobbySection joinSection">
            <div class="sectionHeading">
              <h2>通过 ID 加入</h2>
              <span>公开和非公开房间均可使用</span>
            </div>
            <form id="joinRoomForm" class="joinRoomForm">
              <label>
                <span>房间 ID</span>
                <input id="joinRoomInput" maxlength="40" autocomplete="off" placeholder="输入房间 ID" />
              </label>
              <button type="submit">进入房间</button>
            </form>
          </section>
        </section>
      </section>
    </main>

    <main id="gameApp" class="app hidden">
      <header class="topbar">
        <div>
          <h1>中国象棋</h1>
          <p id="roomStatus">正在连接棋局...</p>
        </div>
        <div class="topActions">
          <label class="themeToggle">
            <input class="themeInput" type="checkbox" />
            <span>夜间模式</span>
          </label>
          <button id="lobbyBtn" type="button">返回大厅</button>
          <button id="copyLinkBtn" type="button">复制邀请链接</button>
        </div>
      </header>

      <section class="layout">
        <aside class="panel">
          <div class="sectionTitle">棋局</div>
          <label class="field">
            <span>邀请链接</span>
            <input id="inviteLink" readonly />
          </label>

          <div class="seatGrid">
            <article class="seat redSeat">
              <strong>红方</strong>
              <span id="redSeatText">空位</span>
              <div class="seatActions">
                <button id="takeRedBtn" type="button">选择红方</button>
                <button id="lockRedBtn" type="button">锁定</button>
              </div>
            </article>
            <article class="seat blackSeat">
              <strong>黑方</strong>
              <span id="blackSeatText">空位</span>
              <div class="seatActions">
                <button id="takeBlackBtn" type="button">选择黑方</button>
                <button id="lockBlackBtn" type="button">锁定</button>
              </div>
            </article>
          </div>

          <div id="requestBox" class="requestBox hidden"></div>

          <div class="controls">
            <button id="undoBtn" type="button">申请悔棋</button>
            <button id="drawBtn" type="button">求和</button>
            <button id="resignBtn" type="button" class="danger">认输</button>
          </div>
        </aside>

        <section class="boardArea">
          <div class="turnStrip">
            <div class="turnInfo">
              <div class="statusLine">
                <span class="statusLabel">当前</span>
                <strong id="turnText">等待开局</strong>
              </div>
              <div class="statusLine lastMoveLine">
                <span class="statusLabel">上一步</span>
                <span id="lastMoveText">尚未走子</span>
              </div>
            </div>
            <span id="viewerText">0 人在线</span>
          </div>
          <div id="board" class="board" aria-label="中国象棋棋盘"></div>
        </section>

        <aside class="panel movesPanel">
          <div class="sideTabs" role="tablist" aria-label="棋局信息">
            <button id="movesTab" type="button" role="tab" aria-selected="true" aria-controls="movesView">棋谱</button>
            <button id="chatTab" type="button" role="tab" aria-selected="false" aria-controls="chatView">讨论</button>
          </div>

          <section id="movesView" role="tabpanel" aria-labelledby="movesTab">
            <ol id="moveList" class="moveList" aria-live="polite"></ol>
          </section>

          <section id="chatView" class="chatView hidden" role="tabpanel" aria-labelledby="chatTab">
            <div class="chatContext">
              <span id="chatContextLabel">当前房间聊天</span>
              <code id="chatContextId"></code>
            </div>
            <form id="chatLookupForm" class="chatLookupForm">
              <input id="chatLookupInput" maxlength="40" autocomplete="off" placeholder="输入聊天 ID 或房间 ID" aria-label="聊天 ID 或房间 ID" />
              <button type="submit">进入</button>
            </form>
            <div class="chatNavigation">
              <button id="currentChatBtn" type="button" disabled>当前房间</button>
              <button id="previousChatBtn" type="button" disabled>上一个聊天</button>
            </div>
            <label class="chatIdentity">
              <span>人物 ID</span>
              <input id="chatNameInput" maxlength="16" autocomplete="nickname" />
            </label>
            <div class="chatIdentityActions">
              <button id="randomNameBtn" type="button">换一个</button>
              <button id="saveNameBtn" type="button">保存人物 ID</button>
            </div>
            <ol id="chatList" class="chatList" aria-live="polite"></ol>
            <form id="chatForm" class="chatForm">
              <textarea id="chatInput" rows="3" maxlength="200" placeholder="输入消息" aria-label="聊天消息"></textarea>
              <div class="chatComposeFooter">
                <span id="chatCount">0 / 200</span>
                <button id="sendChatBtn" type="submit">发送</button>
              </div>
            </form>
          </section>
        </aside>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="dialog">
        <h2 id="confirmTitle">确认</h2>
        <p id="confirmText"></p>
        <div class="dialogActions">
          <button id="confirmCancel" type="button">取消</button>
          <button id="confirmOk" type="button" class="danger">继续</button>
        </div>
      </div>
    </div>

    <div id="requestModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="requestTitle">
      <div class="dialog requestDialog">
        <h2 id="requestTitle">对局请求</h2>
        <p id="requestText"></p>
        <div class="dialogActions">
          <button id="requestReject" type="button">拒绝</button>
          <button id="requestAccept" type="button">接受</button>
        </div>
      </div>
    </div>

    <div id="noticeModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="noticeTitle">
      <div class="dialog noticeDialog">
        <h2 id="noticeTitle">请求反馈</h2>
        <p id="noticeText"></p>
        <div class="dialogActions">
          <button id="noticeOk" type="button">知道了</button>
        </div>
      </div>
    </div>

    <div id="resultModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="dialog resultDialog">
        <h2 id="resultTitle">本局结束</h2>
        <p id="resultText"></p>
        <div class="dialogActions">
          <button id="resultOk" type="button">知道了</button>
        </div>
      </div>
    </div>

    <script src="/engine.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
